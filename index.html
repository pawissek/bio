<!DOCTYPE html>
<html lang="pl"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strona w przebudowie</title>
  <style>
    :root {
  --bg-1: #050508;
  --bg-2: #0d0d12;
  --border: rgba(255, 255, 255, .15);
  --accent: #ffffff;
  --accent-soft: #e2e8f0;
  --text: #f8fafc;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Sora", system-ui, sans-serif;
  color: var(--text);
  overflow-x: hidden;
  background:
    radial-gradient(circle at 80% 10%, rgba(255,255,255,.08), transparent 28%),
    radial-gradient(circle at 10% 90%, rgba(200,200,225,.06), transparent 30%),
    var(--bg-1);
}

body::after {
  content: "";
  position: fixed;
  width: 520px;
  height: 520px;
  right: -170px;
  top: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, .05), transparent 62%);
  filter: blur(4px);
  animation: orbFloat 9s ease-in-out infinite alternate;
  pointer-events: none;
}

.wrap {
  width: min(760px, calc(100% - 28px));
  margin: 20vh auto 0;
  text-align: center;
  position: relative;
  z-index: 1;
}

.profile-card {
  position: relative;
  padding: 60px 40px;
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 34px;
  background: linear-gradient(180deg, rgba(25, 25, 30, .65), rgba(10, 10, 15, .45));
  backdrop-filter: blur(18px);
  box-shadow: 0 30px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
  overflow: hidden;
}

.profile-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  padding: 1px;
  background: conic-gradient(
    from var(--border-angle),
    transparent 0deg,
    transparent 300deg,
    rgba(255, 255, 255, .8) 330deg,
    transparent 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderLight 12s linear infinite;
  opacity: .90;
}

h1 {
  margin: 0 0 20px 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(32px, 5vw, 48px);
  line-height: 1.1;
  letter-spacing: -0.035em;
  font-weight: 800;
  background: linear-gradient(90deg, #ffffff, #94a3b8);
  -webkit-background-clip: text;
  color: transparent;
  opacity: .95;
  animation: titleGlow 4.8s ease-in-out infinite;
}

.status-text {
  font-size: 16px;
  color: var(--muted);
  max-width: 500px;
  margin: 0 auto 36px auto;
  line-height: 1.6;
}

.loader-bar {
  height: 4px;
  width: 140px;
  background: rgba(255,255,255,0.1);
  margin: 0 auto;
  border-radius: 2px;
  overflow: hidden;
}

.loader-fill {
  height: 100%;
  width: 40%;
  background: #ffffff;
  animation: loading 2s infinite ease-in-out;
}

.footer {
  margin-top: 40px;
  font-size: 12px;
  color: var(--muted);
  opacity: 0.6;
}

@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

@keyframes orbFloat {
  from { transform: translate3d(0,0,0) scale(1); }
  to { transform: translate3d(-80px,70px,0) scale(1.12); }
}

@keyframes titleGlow {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 255, 255, .2)); }
  50% { filter: drop-shadow(0 0 16px rgba(255, 255, 255, .4)); }
}

@property --border-angle {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

@keyframes borderLight {
  from { --border-angle: 0deg; }
  to { --border-angle: 360deg; }
}

.light-sweep { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.sweep {
  position: absolute;
  width: 42vw;
  height: 0.5px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
  transform: rotate(-16deg);
  animation: sweep 5s linear infinite;
  opacity: 0.35;
}

@keyframes sweep {
  from { transform: translate3d(-70vw, 0, 0) rotate(-14deg); opacity: 0; }
  18% { opacity: .3; }
  82% { opacity: .3; }
  to { transform: translate3d(130vw, 0, 0) rotate(-14deg); opacity: 0; }
}
  </style>
</head>
<body>
  
  <div class="light-sweep" id="lightSweep" aria-hidden="true"></div>

  <main class="wrap">
    <section class="profile-card">
      <h1>Strona w przebudowie</h1>
      <div class="status-text">
        Trwają prace modernizacyjne. Zapraszamy wkrótce!
      </div>
      <div class="loader-bar">
        <div class="loader-fill"></div>
      </div>
      
      <div class="footer">
        © 2026 Pawissek
      </div>
    </section>
  </main>

<script>
  const lightSweep = document.getElementById('lightSweep');

  for (let i = 0; i < 18; i++) {
    const sweep = document.createElement('span');
    sweep.className = 'sweep';
    sweep.style.left = Math.random() * 100 + 'vw';
    sweep.style.top = Math.random() * 100 + 'vh';
    sweep.style.animationDuration = 12 + Math.random() * 10 + 's';
    sweep.style.animationDelay = -Math.random() * 20 + 's';
    sweep.style.opacity = 0.15 + Math.random() * 0.45;
    lightSweep.appendChild(sweep);
  }
</script>

</body></html>
