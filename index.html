<html lang="pl">
<head>

  <meta property="og:description" content="Wszystkie moje linki w jednym miejscu.">
  <meta property="og:image" content="https://referencja.monsterkoholik.pl/avatar.png">
  <meta property="og:url" content="https://referencja.monsterkoholik.pl/">

       crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Pirata+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #f4f4f4;
      --muted: rgba(255, 255, 255, 0.62);
      --line: rgba(255, 255, 255, 0.16);
      --blackletter: 'Pirata One', cursive, system-ui;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: var(--text);
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* --- TŁO --- */
    #video-bg {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .shade {
      position: fixed; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.6) 100%),
        linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 40%);
    }

    /* --- EKRAN STARTOWY --- */
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      border: none; color: var(--text); font: inherit;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #overlay span {
      font-family: var(--blackletter);
      font-size: clamp(2rem, 7vw, 3.2rem);
      letter-spacing: 2px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      transition: border-color 0.3s, letter-spacing 0.3s;
    }
    #overlay:hover span, #overlay:focus-visible span { border-color: #fff; letter-spacing: 4px; }
    #overlay:focus-visible { outline: none; }

    /* --- UKŁAD --- */
    .stage {
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 48px 28px 140px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 64px;
      align-items: center;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease 0.25s, transform 0.9s ease 0.25s;
    }
    body.in .stage { opacity: 1; transform: none; }

    /* Lewa kolumna: tożsamość */
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      margin-bottom: 22px;
    }
    h1 {
      font-family: var(--blackletter);
      font-weight: 400;
      font-size: clamp(3.2rem, 9vw, 7rem);
      line-height: 0.95;
      letter-spacing: 1px;
      text-shadow: 0 4px 24px rgba(0,0,0,0.6);
      margin-bottom: 18px;
    }
    .bio {
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.5;
      max-width: 400px;
      margin-bottom: 30px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 10px 18px;
      font: inherit; font-size: 0.95rem; font-weight: 400;
      color: var(--text); text-decoration: none;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.25s, transform 0.25s;
    }
    .pill:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
    .pill .discord { color: #5865F2; font-size: 1.1rem; }

    /* Prawa kolumna: lista linków */
    .links { border-top: 1px solid var(--line); }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 16px 6px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 400;
      transition: padding-left 0.25s ease, background 0.25s ease;
    }
    .row:hover, .row:focus-visible { padding-left: 16px; background: rgba(255,255,255,0.07); }
    .ico { display: grid; place-items: center; font-size: 1.3rem; }
    .ico svg { width: 1.2rem; height: 1.2rem; }
    .ico img { height: 1.25rem; width: auto; display: block; }
    .hdl { color: var(--muted); font-size: 0.9rem; font-weight: 300; }

    /* --- ODTWARZACZ (dolny pasek) --- */
    .player {
      position: fixed;
      left: 50%; bottom: 18px;
      transform: translateX(-50%);
      width: min(92vw, 440px);
      padding: 12px 16px 8px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--line);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 10;
    }
    .player-top { display: flex; align-items: center; gap: 14px; }
    .play {
      flex: none; width: 40px; height: 40px;
      border-radius: 50%; border: none;
      background: #fff; color: #000;
      font-size: 0.95rem; cursor: pointer;
      transition: transform 0.2s;
    }
    .play:hover { transform: scale(1.08); }
    .song-title { font-family: var(--blackletter); font-size: 1.25rem; letter-spacing: 1px; line-height: 1.1; }
    .artist { color: var(--muted); font-size: 0.78rem; font-weight: 300; }

    .progress-container { height: 16px; display: flex; align-items: center; cursor: pointer; margin-top: 4px; }
    .progress-track { width: 100%; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
    .progress { width: 0%; height: 100%; background: #fff; transition: width 0.1s linear; }

    /* --- POWIADOMIENIE --- */
    #copy-toast {
      position: fixed; top: 24px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      display: flex; align-items: center; gap: 8px;
      padding: 10px 22px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--line);
      border-radius: 30px;
      font-size: 0.9rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    #copy-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    #copy-toast i { color: #5865F2; }

    a:focus-visible, button:focus-visible, .progress-container:focus-visible {
      outline: 2px solid #fff; outline-offset: 3px;
    }

    @media (max-width: 920px) {
      .shade { background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0.5)); }
      .stage { grid-template-columns: 1fr; gap: 36px; align-items: start; padding-top: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { transition: none; transform: none; }
      * { transition-duration: 0.01s !important; }
    }
  </style>
</head>
<body>

  <div id="copy-toast" role="status" aria-live="polite">

  <button id="overlay" type="button" onclick="enterSite()"><span>Kliknij, aby wejść</span></button>

  <video loop muted playsinline preload="metadata" id="video-bg" aria-hidden="true">
    <source src="bg.mp4" type="video/mp4">

  <div class="shade" aria-hidden="true"></div>

  <main class="stage">

      <img src="avatar.png" alt="Avatar @referencja" class="avatar">
      <h1>@referencja</h1>

      <div class="pills">

        <a class="pill" href="http://reflauncher.monsterkoholik.pl/" target="_blank" rel="noopener">
          <i class="fa-solid fa-mobile-screen" aria-hidden="true"></i>
          <span>RefLauncher</span>
        </a>
      </div>
    </section>

    <nav class="links" aria-label="Moje linki">
      <a class="row" href="https://twitch.tv/pawissek" target="_blank" rel="noopener">
        <span class="ico"><i class="fa-brands fa-twitch" aria-hidden="true"></i></span>
        <span>Twitch</span><span class="hdl">pawissek</span>
      </a>
      <a class="row" href="https://kick.com/pawissek" target="_blank" rel="noopener">
        <span class="ico"><img src="kick.png" alt=""></span>
        <span>Kick</span><span class="hdl">pawissek</span>
      </a>
      <a class="row" href="https://x.com/pawissek" target="_blank" rel="noopener">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M0 0v24h24V0H0zm4 4h16v16H4V4zm3 3v10h4v-5h2v5h4V10h-4V7H7z"/></svg>

        <span class="ico"><i class="fa-brands fa-steam" aria-hidden="true"></i></span>
        <span>Steam</span><span class="hdl">pawissek</span>
      </a>

  <div class="player">
    <div class="player-top">
      <button class="play" id="play" type="button" aria-label="Odtwórz lub zatrzymaj"><i class="fas fa-play" aria-hidden="true"></i></button>
      <div>
        <div class="song-title">joint i sport</div>
        <div class="artist">kuqe 2115</div>
      </div>
    </div>
    <div class="progress-container" id="progress-container" role="slider" tabindex="0"
         aria-label="Postęp utworu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-track"><div class="progress" id="progress"></div></div>
    </div>
  </div>

  <audio id="audio" src="song.mp3" loop preload="metadata"></audio>

  <script>
    const audio = document.getElementById('audio');
    const video = document.getElementById('video-bg');
    const playBtn = document.getElementById('play');
    const playIcon = playBtn.querySelector('i');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progress-container');
    let toastTimeout;

    function copyDiscordNick(nick) {
      navigator.clipboard.writeText(nick).then(() => {
        const toast = document.getElementById('copy-toast');
        clearTimeout(toastTimeout);
        toast.classList.add('show');
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
      }).catch(err => console.error('Błąd podczas kopiowania: ', err));
    }

    function enterSite() {
      const overlay = document.getElementById('overlay');
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
      document.body.classList.add('in');
      audio.play().catch(() => video.play().catch(() => {}));
    }

    audio.addEventListener('play', () => { playIcon.className = 'fas fa-pause'; video.play().catch(() => {}); });
    audio.addEventListener('pause', () => { playIcon.className = 'fas fa-play'; video.pause(); });

    playBtn.addEventListener('click', () => {
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progress.style.width = pct + '%';
      progressContainer.setAttribute('aria-valuenow', Math.round(pct));
    });

    function seekTo(clientX) {
      const rect = progressContainer.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    }
    progressContainer.addEventListener('click', e => seekTo(e.clientX));
    progressContainer.addEventListener('keydown', e => {
      if (!audio.duration) return;
      if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    });
  </script>
